appId: com.earthwttw.leftloversmerchantfronend
---
- launchApp
- tapOn:
    id: "start-journey-button"
- tapOn: "Enter your email"
- inputText: "earthwittawat2005@gmail.com"
- pressKey: "Enter"
- tapOn: "Enter your password"
- inputText: "_Test12345"
- pressKey: "Enter"
- tapOn: "e.g. WakeUp"
- inputText: "Leftlovers Store"
- pressKey: "Enter"
- tapOn: "Address"
- inputText: "126, Pracha Uthit"
- pressKey: "Enter"
- tapOn: "City"
- inputText: "Bangkok"
- pressKey: "Enter"
- tapOn: "District"
- inputText: "Thung Khru"
- pressKey: "Enter"
- tapOn: "Subdistrict"
- inputText: "Bang Mot"
- pressKey: "Enter"
- scrollUntilVisible:
    element:
      id: "business-hours-title"
    direction: "DOWN"
- tapOn: "Postal Code"
- inputText: 10140
- pressKey: "Enter"
- tapOn: "Vietnamese, ▾"
- tapOn: "Done"


