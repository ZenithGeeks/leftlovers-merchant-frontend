name: CI Prebuild

on:
  push:
    branches:
      - master

jobs:
  prebuild:
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v3

      - name: 🏗 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Expo prebuild
        run: npx expo prebuild --non-interactive --no-install
