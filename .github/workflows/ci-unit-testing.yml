name: 🧪 Unit Test Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧠 Type check
        run: npm run typecheck --if-present

      - name: 🧪 Run unit tests
        run: |
          npm test -- \
            --ci \
            --runInBand \
            --passWithNoTests \
            --updateSnapshot

      - name: 📊 Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
